name: paper
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rebuild the paper with the pinned TeX Live image
        run: sh scripts/build-paper.sh
      - name: Compare the PDF and bibliography with the distributed files
        run: git diff --exit-code -- paper/main.pdf paper/main.bbl
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: paper-pdf
          path: paper/main.pdf
