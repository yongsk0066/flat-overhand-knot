name: paper
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: xu-cheng/latex-action@4.1.0
        with:
          root_file: main.tex
          working_directory: paper
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: paper-pdf
          path: paper/main.pdf
