name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
      - name: Install locked environment
        run: uv sync --locked
      - name: Syntax-check the whole suite
        run: uv run python -m compileall -q verify
      - name: Exact geometry, descent, local optimality and interval certificates
        run: sh scripts/verify-core.sh
      - name: Script, log and exported-geometry integrity
        run: |
          sha256sum -c logs/hashes-verify.txt
          sha256sum -c logs/hashes-logs.txt
          sha256sum -c logs/hashes-artifacts.txt

      - name: Compare the published archive with this checkout
        run: sh scripts/make-ancillary.sh --check
