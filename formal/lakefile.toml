name = "formal"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Formal"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header.license = "Released under the MIT license as described in the file LICENSE."
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "Formal"
